  <noscript><p style="padding:24px;color:#e2e8f0">O Minhas Moedinhas precisa de JavaScript ativado para funcionar.</p></noscript>

  <script>
  /* ═══════════════════════════════════════════════════════════════
     MINHAS MOEDINHAS · MVP de arquivo único (React 18 + htm + Tailwind)
     Bíblia do projeto: simplicidade extrema, feedback visual imediato,
     fricção zero (funciona sem login, dados no localStorage) e
     login opcional (Supabase) para sincronizar entre dispositivos.
     ═══════════════════════════════════════════════════════════════ */
  (function () {
    'use strict';
    const { useState, useEffect, useCallback, useMemo, useRef } = React;
    const html = htm.bind(React.createElement);

    /* ════════ CONFIGURAÇÃO ════════ */
    const CONFIG = {
      appUrl: 'https://minhas-moedinhas.vercel.app/',
      supabaseUrl: 'https://gqpxxwfahnwnhklbjwxr.supabase.co',
      // Chave pública (publishable). A segurança vem das políticas RLS — ver supabase/schema.sql
      supabaseAnonKey: 'sb_publishable_LiUY4XIO_xNS_aEqpmQlkQ_etMa1iB5',
      // Links de parceiros (afiliação/CPA). Troque pelos seus links com código de afiliado.
      parceiro: { nome: 'corretora parceira', url: 'https://www.xpi.com.br/' },
      // Premissas educativas de rentabilidade mensal para renda variável (Fase 1: dados mockados)
      premissas: { fiiMensal: 0.006, acoesMensal: 0.010 },
      // Valores de referência caso o Banco Central esteja fora do ar (nov/2026)
      indicadoresReferencia: { selic: 13.75, cdi: 13.65, ipca: 4.63, data: 'nov/2026' },
      cacheIndicadoresMs: 6 * 60 * 60 * 1000,
    };
    const STORAGE_PREFIX = 'mm:v1:';

    let sb = null;
    try {
      if (window.supabase && CONFIG.supabaseUrl && CONFIG.supabaseAnonKey) {
        sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);
      }
    } catch (e) { console.warn('[auth] Supabase indisponível, seguindo só no modo local.', e); }

    /* ════════ UTILITÁRIOS ════════ */
    const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
    const fmtBRL = (v) => brl.format(Number(v) || 0);
    const fmtCompacto = (v) => (Math.abs(v) >= 1000 ? 'R$ ' + (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil' : fmtBRL(v));
    const fmtPct = (v, casas = 2) => (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas }) + '%';
    const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

    /** Aceita "1.234,56", "1234,56", "1234.56" e "R$ 50". Retorna número ou NaN. */
    function parseValor(entrada) {
      if (typeof entrada === 'number') return entrada;
      let s = String(entrada || '').replace(/[^\d.,-]/g, '').trim();
      if (!s) return NaN;
      if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
      else if ((s.match(/\./g) || []).length > 1 || /^\d{1,3}\.\d{3}$/.test(s)) s = s.replace(/\./g, ''); // "2.000" = dois mil
      const n = parseFloat(s);
      return Number.isFinite(n) ? Math.round(n * 100) / 100 : NaN;
    }
    const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
    const anualParaMensal = (taxaAnualPct) => Math.pow(1 + taxaAnualPct / 100, 1 / 12) - 1;

    function traduzirErro(msg) {
      if (!msg) return 'Ocorreu um erro. Tente novamente.';
      if (msg.includes('Invalid login credentials')) return 'E-mail ou senha incorretos.';
      if (msg.includes('Email not confirmed')) return 'Confirme seu e-mail antes de entrar (veja sua caixa de entrada).';
      if (msg.includes('User already registered')) return 'Este e-mail já possui cadastro.';
      if (msg.includes('Password should be')) return 'A senha deve ter pelo menos 6 caracteres.';
      if (msg.toLowerCase().includes('rate limit')) return 'Muitas tentativas. Aguarde alguns minutos.';
      if (msg.includes('Failed to fetch')) return 'Sem conexão com o servidor. Verifique sua internet.';
      return msg;
    }

    const local = {
      get(key, fallback) { try { const v = localStorage.getItem(STORAGE_PREFIX + key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
      set(key, value) { try { localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value)); } catch { /* modo privado/cota cheia */ } },
      remove(key) { try { localStorage.removeItem(STORAGE_PREFIX + key); } catch {} },
    };

    /* ════════ CAMADA DE DADOS (Repositório) ════════
       Mesma interface para visitante (localStorage) e usuário logado (Supabase). */
    function criarRepoLocal() {
      return {
        modo: 'local',
        async carregar() {
          return {
            carteira: local.get('carteira', { aporte: null, perfil: 'moderado' }),
            transacoes: local.get('transacoes', []),
            metas: local.get('metas', []),
          };
        },
        async salvarCarteira(aporte, perfil) { local.set('carteira', { aporte, perfil }); },
        async salvarMeta(m) {
          const meta = { id: m.id || uid(), created_at: m.created_at || new Date().toISOString(), ...m };
          const lista = local.get('metas', []).filter(x => x.id !== meta.id);
          local.set('metas', [...lista, meta]);
          return meta;
        },
        async removerMeta(id) { local.set('metas', local.get('metas', []).filter(m => m.id !== id)); },
        async adicionarTransacao(t) {
          const nova = { id: uid(), created_at: new Date().toISOString(), ...t };
          local.set('transacoes', [nova, ...local.get('transacoes', [])]);
          return nova;
        },
        async removerTransacao(id) { local.set('transacoes', local.get('transacoes', []).filter(t => t.id !== id)); },
        async apagarTudo() { local.remove('carteira'); local.remove('transacoes'); local.remove('metas'); },
      };
    }

    function criarRepoNuvem(userId) {
      const ok = ({ data, error }) => { if (error) throw error; return data; };
      const normalizar = (t) => ({ ...t, valor: Number(t.valor) });
      const CAMPOS_META = 'id, nome, valor_alvo, prazo, guardado, concluida_em, created_at';
      const metaDoBanco = (m) => ({ id: m.id, nome: m.nome, valorAlvo: Number(m.valor_alvo), prazo: String(m.prazo).slice(0, 7), guardado: Number(m.guardado), concluidaEm: m.concluida_em, created_at: m.created_at });
      return {
        modo: 'nuvem',
        async carregar() {
          const [port, trans] = await Promise.all([
            sb.from('portfolios').select('aporte, perfil').eq('user_id', userId).maybeSingle(),
            sb.from('transacoes').select('id, descricao, valor, tipo, created_at').eq('user_id', userId).order('created_at', { ascending: false }),
          ]);
          const carteira = ok(port) || {};
          // Metas são opcionais: se a tabela ainda não existir, o resto do app continua funcionando.
          const metasRes = await sb.from('metas').select(CAMPOS_META).eq('user_id', userId).order('created_at');
          if (metasRes.error) console.warn('[metas]', metasRes.error.message);
          return {
            carteira: { aporte: carteira.aporte != null ? Number(carteira.aporte) : null, perfil: carteira.perfil || 'moderado' },
            transacoes: (ok(trans) || []).map(normalizar),
            metas: (metasRes.data || []).map(metaDoBanco),
          };
        },
        async salvarMeta(m) {
          const linha = { user_id: userId, nome: m.nome, valor_alvo: m.valorAlvo, prazo: m.prazo + '-01', guardado: m.guardado || 0, concluida_em: m.concluidaEm || null };
          if (m.id) linha.id = m.id;
          return metaDoBanco(ok(await sb.from('metas').upsert(linha).select(CAMPOS_META).single()));
        },
        async removerMeta(id) { ok(await sb.from('metas').delete().eq('id', id).eq('user_id', userId)); },
        async salvarCarteira(aporte, perfil) {
          ok(await sb.from('portfolios').upsert({ user_id: userId, aporte, perfil }, { onConflict: 'user_id' }));
        },
        async adicionarTransacao(t) {
          return normalizar(ok(await sb.from('transacoes').insert({ user_id: userId, ...t }).select('id, descricao, valor, tipo, created_at').single()));
        },
        async removerTransacao(id) { ok(await sb.from('transacoes').delete().eq('id', id).eq('user_id', userId)); },
        async apagarTudo() {
          ok(await sb.from('transacoes').delete().eq('user_id', userId));
          ok(await sb.from('portfolios').delete().eq('user_id', userId));
          const r = await sb.from('metas').delete().eq('user_id', userId);
          if (r.error) console.warn('[metas]', r.error.message);
        },
      };
    }

    /** Ao entrar pela 1ª vez, leva para a nuvem o que o visitante já tinha registrado no aparelho. */
    async function migrarVisitanteParaNuvem(repoNuvem) {
      const carteira = local.get('carteira', null);
      const transacoes = local.get('transacoes', []);
      const metas = local.get('metas', []);
      if (!(carteira && carteira.aporte) && transacoes.length === 0 && metas.length === 0) return false;
      const atual = await repoNuvem.carregar();
      if (carteira && carteira.aporte && !atual.carteira.aporte) await repoNuvem.salvarCarteira(carteira.aporte, carteira.perfil || 'moderado');
      for (const t of [...transacoes].reverse()) {
        await repoNuvem.adicionarTransacao({ descricao: t.descricao, valor: t.valor, tipo: t.tipo });
      }
      for (const m of metas) {
        const { id, created_at, ...resto } = m;
        try { await repoNuvem.salvarMeta(resto); } catch (e) { console.warn('[metas] migração', e.message); return true; }
      }
      local.remove('carteira'); local.remove('transacoes'); local.remove('metas');
      return true;
    }

    /* ════════ INDICADORES REAIS (API pública do Banco Central · SGS) ════════ */
    const SERIES_BCB = { selic: 432, cdi: 4389, ipca: 13522 };
    async function buscarSerieBCB(codigo, signal) {
      const res = await fetch(`https://api.bcb.gov.br/dados/serie/bcdata.sgs.${codigo}/dados/ultimos/1?formato=json`, { signal });
      if (!res.ok) throw new Error('BCB ' + res.status);
      const json = await res.json();
      const valor = parseFloat(json?.[0]?.valor);
      if (!Number.isFinite(valor)) throw new Error('BCB valor inválido');
      return { valor, data: json[0].data };
    }
    function useIndicadores() {
      const ref = CONFIG.indicadoresReferencia;
      const [estado, setEstado] = useState(() => {
        const cache = local.get('indicadores', null);
        if (cache && Date.now() - cache.ts < CONFIG.cacheIndicadoresMs) return { ...cache.dados, aoVivo: true, carregando: false };
        return { selic: ref.selic, cdi: ref.cdi, ipca: ref.ipca, data: ref.data, aoVivo: false, carregando: true };
      });
      useEffect(() => {
        if (!estado.carregando) return;
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 6000);
        Promise.allSettled(Object.values(SERIES_BCB).map(c => buscarSerieBCB(c, ctrl.signal))).then(([s, c, i]) => {
          const pega = (r, fb) => (r.status === 'fulfilled' ? r.value.valor : fb);
          const algumAoVivo = [s, c, i].some(r => r.status === 'fulfilled');
          const dados = { selic: pega(s, ref.selic), cdi: pega(c, ref.cdi), ipca: pega(i, ref.ipca), data: c.status === 'fulfilled' ? c.value.data : ref.data }; // data do último CDI (dia útil); a série da Selic meta traz a data de vigência
          if (algumAoVivo) local.set('indicadores', { ts: Date.now(), dados });
          setEstado({ ...dados, aoVivo: algumAoVivo, carregando: false });
        }).finally(() => clearTimeout(timer));
        return () => { ctrl.abort(); clearTimeout(timer); };
      }, []);
      return estado;
    }

    /* ════════ REGRAS DE NEGÓCIO ════════ */
    const PERFIS = {
      conservador: {
        label: 'Conservador', emoji: '🛡️',
        alocacao: [
          { chave: 'rf', nome: 'Renda Fixa', pct: 0.70, cor: 'text-indigo-300', bg: 'bg-indigo-400' },
          { chave: 'fii', nome: 'FIIs (Imobiliário)', pct: 0.20, cor: 'text-emerald-300', bg: 'bg-emerald-400' },
          { chave: 'acoes', nome: 'Ações', pct: 0.10, cor: 'text-amber-300', bg: 'bg-amber-400' },
        ],
        estudos: [
          { id: 'tesouro-selic', emoji: '🏛️', titulo: 'Tesouro Selic', tag: 'Renda Fixa · Risco muito baixo', tagColor: 'bg-indigo-900/60 text-indigo-200 border border-indigo-700/40', descricao: 'Título público que acompanha a taxa Selic e pode ser resgatado a qualquer dia útil. Muito usado como reserva de emergência.', onde: 'Onde encontrar o Tesouro Selic?' },
          { id: 'cdb-liquidez', emoji: '🏦', titulo: 'CDB com liquidez diária', tag: 'Renda Fixa · Risco baixo', tagColor: 'bg-indigo-900/60 text-indigo-200 border border-indigo-700/40', descricao: 'Empréstimo que você faz a um banco, geralmente atrelado ao CDI. Tem proteção do FGC até R$ 250 mil por CPF e instituição.', onde: 'Onde comparar CDBs?' },
          { id: 'lci-lca', emoji: '🌾', titulo: 'LCI e LCA', tag: 'Renda Fixa · Risco baixo', tagColor: 'bg-indigo-900/60 text-indigo-200 border border-indigo-700/40', descricao: 'Letras de crédito imobiliário e do agronegócio, isentas de IR para pessoa física e cobertas pelo FGC. Costumam ter prazo mínimo de carência.', onde: 'Onde encontrar LCI e LCA?' },
        ],
      },
      moderado: {
        label: 'Moderado', emoji: '⚖️',
        // Divisão padrão definida na Bíblia: 50% RF · 40% FIIs · 10% Ações
        alocacao: [
          { chave: 'rf', nome: 'Renda Fixa', pct: 0.50, cor: 'text-indigo-300', bg: 'bg-indigo-400' },
          { chave: 'fii', nome: 'FIIs (Imobiliário)', pct: 0.40, cor: 'text-emerald-300', bg: 'bg-emerald-400' },
          { chave: 'acoes', nome: 'Ações', pct: 0.10, cor: 'text-amber-300', bg: 'bg-amber-400' },
        ],
        estudos: [
          { id: 'tesouro-ipca', emoji: '📈', titulo: 'Tesouro IPCA+', tag: 'Renda Fixa · Risco baixo', tagColor: 'bg-indigo-900/60 text-indigo-200 border border-indigo-700/40', descricao: 'Paga a inflação (IPCA) mais um juro fixo, protegendo o poder de compra no longo prazo. O preço oscila se vendido antes do vencimento.', onde: 'Onde encontrar o Tesouro IPCA+?' },
          { id: 'fii-tijolo', emoji: '🏢', titulo: 'Fundos Imobiliários (FIIs)', tag: 'Renda Variável · Risco médio', tagColor: 'bg-emerald-900/60 text-emerald-200 border border-emerald-700/40', descricao: 'Fundos que investem em imóveis ou títulos imobiliários e costumam distribuir rendimentos mensais, hoje isentos de IR para pessoa física.', onde: 'Onde comprar cotas de FIIs?' },
          { id: 'acoes-dividendos', emoji: '📊', titulo: 'Ações de empresas maduras', tag: 'Renda Variável · Risco médio', tagColor: 'bg-amber-900/60 text-amber-200 border border-amber-700/40', descricao: 'Ser sócio de empresas consolidadas que dividem parte do lucro com acionistas (dividendos). O preço varia todos os dias.', onde: 'Onde comprar ações?' },
        ],
      },
      arrojado: {
        label: 'Arrojado', emoji: '🚀',
        alocacao: [
          { chave: 'rf', nome: 'Renda Fixa', pct: 0.20, cor: 'text-indigo-300', bg: 'bg-indigo-400' },
          { chave: 'fii', nome: 'FIIs (Imobiliário)', pct: 0.30, cor: 'text-emerald-300', bg: 'bg-emerald-400' },
          { chave: 'acoes', nome: 'Ações', pct: 0.50, cor: 'text-amber-300', bg: 'bg-amber-400' },
        ],
        estudos: [
          { id: 'etf-ibov', emoji: '🧺', titulo: 'ETFs de índice', tag: 'Renda Variável · Risco alto', tagColor: 'bg-amber-900/60 text-amber-200 border border-amber-700/40', descricao: 'Fundos negociados em bolsa que replicam um índice (ex.: Ibovespa). Diversificam em várias empresas com uma única compra.', onde: 'Onde comprar ETFs?' },
          { id: 'etf-internacional', emoji: '🌎', titulo: 'ETFs internacionais', tag: 'Renda Variável · Risco alto', tagColor: 'bg-amber-900/60 text-amber-200 border border-amber-700/40', descricao: 'Exposição a empresas de outros países, inclusive variação do dólar. Ajuda a diversificar, mas soma o risco cambial.', onde: 'Onde comprar ETFs internacionais?' },
          { id: 'small-caps', emoji: '🌱', titulo: 'Ações de empresas menores', tag: 'Renda Variável · Risco muito alto', tagColor: 'bg-red-900/50 text-red-200 border border-red-700/40', descricao: 'Small caps podem crescer mais, mas oscilam muito e podem ter perdas fortes. Só para quem já tem reserva e pensa no longo prazo.', onde: 'Onde estudar small caps?' },
        ],
      },
    };

    function taxasMensais(perfilKey, selicAnual) {
      return { rf: anualParaMensal(selicAnual), fii: CONFIG.premissas.fiiMensal, acoes: CONFIG.premissas.acoesMensal };
    }

    /** Projeção de APORTES MENSAIS: todo mês entra o aporte, distribuído pelo perfil, e cada parte rende sua taxa. */
    function projetarAportes(aporteMensal, perfilKey, selicAnual, meses = 12, hoje = new Date()) {
      const taxas = taxasMensais(perfilKey, selicAnual);
      const saldo = { rf: 0, fii: 0, acoes: 0 };
      const pontos = [];
      for (let i = 0; i < meses; i++) {
        for (const k of Object.keys(saldo)) saldo[k] *= 1 + taxas[k];
        for (const a of PERFIS[perfilKey].alocacao) saldo[a.chave] += aporteMensal * a.pct;
        const d = new Date(hoje.getFullYear(), hoje.getMonth() + i, 1);
        pontos.push({ rotulo: MESES[d.getMonth()], ano: d.getFullYear(), investido: aporteMensal * (i + 1), total: saldo.rf + saldo.fii + saldo.acoes });
      }
      return pontos;
    }

    /** Evolução real do patrimônio a partir dos lançamentos do usuário (saldo acumulado ao fim de cada mês). */
    function evolucaoPatrimonio(transacoes, meses = 6, hoje = new Date()) {
      const fimDoMes = (ano, mes) => new Date(ano, mes + 1, 0, 23, 59, 59, 999);
      const pontos = [];
      for (let i = meses - 1; i >= 0; i--) {
        const d = new Date(hoje.getFullYear(), hoje.getMonth() - i, 1);
        const limite = fimDoMes(d.getFullYear(), d.getMonth());
        const saldo = transacoes.reduce((acc, t) => (new Date(t.created_at) <= limite ? acc + (t.tipo === 'entrada' ? t.valor : -t.valor) : acc), 0);
        pontos.push({ rotulo: MESES[d.getMonth()], ano: d.getFullYear(), total: saldo });
      }
      return pontos;
    }

    /* ════════ METAS ════════ */
    const mesAtualISO = (hoje = new Date()) => `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}`;
    const rotuloMes = (iso) => { const [a, m] = iso.split('-').map(Number); return MESES[m - 1] + '/' + a; };

    /** Meses de depósito até o prazo, contando o mês atual. Prazo "2027-06" = até o fim de junho/2027. 0 = vencida. */
    function mesesAte(prazoISO, hoje = new Date()) {
      const [a, m] = String(prazoISO).split('-').map(Number);
      if (!a || !m) return 0;
      const dif = (a * 12 + (m - 1)) - (hoje.getFullYear() * 12 + hoje.getMonth());
      return dif < 0 ? 0 : dif + 1;
    }

    /** Quanto depositar por mês para chegar ao alvo, com o dinheiro rendendo à taxa mensal i (0 = sem render). */
    function aporteNecessario(alvo, guardado, meses, i = 0) {
      const falta = alvo - guardado;
      if (falta <= 0) return 0;
      if (meses <= 0) return falta;
      if (!(i > 0)) return falta / meses;
      const fator = Math.pow(1 + i, meses);
      const restante = alvo - guardado * fator;
      if (restante <= 0) return 0;
      return restante * i / (fator - 1);
    }

    /** Sugestão educativa de onde estudar para guardar o dinheiro, conforme o prazo. */
    function sugestaoParaMeta(meta, meses) {
      if (/reserva|emerg/i.test(meta.nome) || meses <= 12) return { titulo: 'Tesouro Selic ou CDB com liquidez diária', porque: 'prazo curto pede segurança e resgate rápido' };
      if (meses <= 36) return { titulo: 'CDB, LCI ou LCA com vencimento próximo do prazo', porque: 'rendem mais que a poupança e têm proteção do FGC' };
      return { titulo: 'Tesouro IPCA+', porque: 'protege da inflação em prazos longos' };
    }

    /* ════════ COMPONENTES ATÔMICOS ════════ */
    function Spinner({ size = 'w-5 h-5', label = 'Carregando' }) {
      return html`<svg class=${'spin ' + size} viewBox="0 0 24 24" fill="none" role="img" aria-label=${label}><circle cx="12" cy="12" r="10" stroke="#1e293b" stroke-width="3"/><path d="M12 2a10 10 0 0 1 10 10" stroke="#34d399" stroke-width="3" stroke-linecap="round"/></svg>`;
    }
    function CoinLogo({ size = 28 }) {
      return html`<svg width=${size} height=${size} viewBox="0 0 28 28" fill="none" aria-hidden="true"><circle cx="14" cy="14" r="14" fill="#34d399" fill-opacity="0.12"/><circle cx="14" cy="14" r="10" fill="#34d399" fill-opacity="0.22"/><circle cx="14" cy="14" r="7" fill="#34d399" fill-opacity="0.18"/><text x="14" y="18.5" text-anchor="middle" font-size="11" font-family="Inter,sans-serif" font-weight="800" fill="#34d399">$</text></svg>`;
    }
    const Valor = ({ v, mostrar, compacto, className = '' }) => mostrar
      ? html`<span class=${className}>${compacto ? fmtCompacto(v) : fmtBRL(v)}</span>`
      : html`<span class=${className + ' privacy-blur'} aria-label="valor oculto">R$ ••••</span>`;

    /** Modal acessível: role=dialog, fecha com Esc e no fundo, devolve o foco ao fechar. */
    function Modal({ titulo, onClose, children, largura = 'max-w-sm' }) {
      const ref = useRef(null);
      useEffect(() => {
        const anterior = document.activeElement;
        const foco = ref.current?.querySelector('input, button:not([data-close]), select, textarea, a[href]');
        (foco || ref.current)?.focus();
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        document.body.style.overflow = 'hidden';
        return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; anterior?.focus?.(); };
      }, []);
      return html`<div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4 modal-overlay fade-up" onClick=${e => { if (e.target === e.currentTarget) onClose(); }}>
        <div ref=${ref} role="dialog" aria-modal="true" aria-labelledby="modal-titulo" tabIndex="-1" class=${'bg-[#1a2233] rounded-2xl border border-slate-700/60 shadow-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto ' + largura}>
          <div class="flex items-center justify-between gap-3">
            <h2 id="modal-titulo" class="text-lg font-bold text-[#34d399]">${titulo}</h2>
            <button data-close onClick=${onClose} aria-label="Fechar" class="text-slate-400 hover:text-slate-200 p-1 rounded-lg"><svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
          </div>
          ${children}
        </div>
      </div>`;
    }

    function Toast({ toast, onClose }) {
      useEffect(() => { if (!toast) return; const t = setTimeout(onClose, 4500); return () => clearTimeout(t); }, [toast]);
      if (!toast) return null;
      const cor = toast.tipo === 'erro' ? 'bg-red-950/90 border-red-700/60 text-red-200' : 'bg-emerald-950/90 border-emerald-700/60 text-emerald-200';
      return html`<div role=${toast.tipo === 'erro' ? 'alert' : 'status'} class=${'fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] max-w-sm w-[calc(100%-2rem)] px-4 py-3 rounded-xl border text-sm shadow-2xl fade-up ' + cor}>${toast.msg}</div>`;

    function Simulador({ aporte, perfil, ind, mostrar, salvando, onSimular, onPerfil }) {
      const [texto, setTexto] = useState(aporte ? String(aporte).replace('.', ',') : '');
      const [erro, setErro] = useState('');
      useEffect(() => { if (aporte) setTexto(String(aporte).replace('.', ',')); }, [aporte]);
      function simular(e) {
        e?.preventDefault();
        const v = parseValor(texto);
        if (!Number.isFinite(v) || v <= 0) { setErro('Digite um valor maior que zero. Ex.: 150 ou 150,50'); return; }
        if (v > 10_000_000) { setErro('Valor muito alto para a simulação.'); return; }
        setErro(''); onSimular(v);
      }
      return html`<section aria-labelledby="sim-titulo" class="bg-[#1a2233] p-5 rounded-2xl border border-slate-800 shadow-xl space-y-4">
        <div class="flex items-center justify-between"><h2 id="sim-titulo" class="text-xs font-semibold text-[#a5b4fc] uppercase tracking-wider">Simulador de Aporte</h2>${salvando ? html`<${Spinner} size="w-3.5 h-3.5" label="Salvando" />` : null}</div>

          </div>
          ${erro ? html`<p id="aporte-erro" class="text-xs text-red-300">${erro}</p>` : null}

        ${aporte ? html`<${ResultadoAlocacao} aporte=${aporte} perfil=${perfil} ind=${ind} mostrar=${mostrar} />` : null}
      </section>`;
    }

    function Barras({ dados, campo, cls, mostrar, descricao }) {
      const max = Math.max(1, ...dados.map(d => Math.abs(d[campo])));
      return html`<div>
        <div class="flex items-end justify-between h-28 gap-1 px-0.5" role="img" aria-label=${descricao}>
          ${dados.map(d => {
            const v = d[campo];
            const pct = Math.max((Math.abs(v) / max) * 100, v === 0 ? 0 : 3);
            const inv = d.investido != null ? Math.max((d.investido / max) * 100, 2) : null;
            return html`<div key=${d.rotulo + d.ano} class="flex flex-col items-center w-full h-full justify-end" title=${mostrar ? `${d.rotulo}/${d.ano}: ${fmtBRL(v)}` : d.rotulo}>
              <div class="w-full h-full flex items-end gap-px">
                ${inv != null ? html`<div class="bar-animate bar-invest w-1/3 rounded-t-sm" style=${{ height: inv + '%' }}></div>` : null}
                <div class=${'bar-animate w-full rounded-t-sm ' + (v < 0 ? 'bar-neg' : cls)} style=${{ height: pct + '%', minHeight: v === 0 ? '2px' : '4px' }}></div>
              </div>
              <span class="text-[10px] mt-1 text-slate-400 font-medium" aria-hidden="true">${d.rotulo}</span>
            </div>`;
          })}
        </div>
        <table class="sr-only"><caption>${descricao}</caption><tbody>${dados.map(d => html`<tr key=${'t' + d.rotulo + d.ano}><th scope="row">${d.rotulo}/${d.ano}</th><td>${mostrar ? fmtBRL(d[campo]) : 'oculto'}</td></tr>`)}</tbody></table>

      const final = projecao[projecao.length - 1];
      const tab = (id, label, ativo, cor) => html`<button role="tab" id=${'tab-' + id} aria-selected=${ativo} aria-controls=${'painel-' + id} onClick=${() => setAba(id)} class=${'btn px-3 py-1 rounded-lg text-[11px] font-semibold border ' + (ativo ? cor : 'bg-transparent border-transparent text-slate-400 hover:text-slate-200')}>${label}</button>`;

                <div class="mt-2 pt-2 border-t border-slate-800/60 flex items-center justify-between"><span class="text-[11px] text-slate-400">Saldo atual</span><${Valor} v=${evolucao[evolucao.length - 1].total} mostrar=${mostrar} className="text-sm font-bold text-[#34d399]" /></div>`
            : html`<div class="h-28 flex flex-col items-center justify-center gap-1 border border-dashed border-slate-700/60 rounded-xl bg-[#0d1117]/30 px-4 text-center"><span class="text-xl" aria-hidden="true">🪙</span><p class="text-xs text-slate-400">Registre suas moedinhas no gerenciador abaixo para ver sua evolução mês a mês.</p></div>`)
          : (aporte
            ? html`<${Barras} dados=${projecao} campo="total" cls="bar-proj" mostrar=${mostrar} descricao=${'Projeção de patrimônio aportando ' + fmtBRL(aporte) + ' por mês durante 12 meses'} />
                <div class="mt-2 flex items-center gap-3 text-[10px] text-slate-400"><span class="flex items-center gap-1"><span class="w-2 h-2 rounded-sm bar-invest inline-block" aria-hidden="true"></span>Você guardou</span><span class="flex items-center gap-1"><span class="w-2 h-2 rounded-sm bar-proj inline-block" aria-hidden="true"></span>Com rendimentos</span></div>

            : html`<div class="h-28 flex flex-col items-center justify-center gap-1 border border-dashed border-slate-700/60 rounded-xl bg-[#0d1117]/30"><span class="text-xl" aria-hidden="true">💡</span><p class="text-xs text-slate-400 text-center">Faça uma simulação para ver a projeção.</p></div>`)}
        </div>
      </section>`;
    }

    function ParaEstudar({ perfil }) {
      const [aberto, setAberto] = useState(null);
      return html`<section aria-labelledby="estudar-titulo" class="space-y-2">
        <div class="px-1"><h2 id="estudar-titulo" class="text-xs font-semibold text-[#a5b4fc] uppercase tracking-wider">📚 Para estudar · perfil ${PERFIS[perfil].label}</h2><p class="text-[11px] text-slate-400">Conteúdo educativo para conhecer cada tipo de investimento. Não é recomendação.</p></div>

      return html`<aside aria-label="Parceiros" class="banner-glow rounded-2xl p-4 text-center space-y-1.5">

    function Conquistas({ temAporte, perfilDefinido, temLancamento, poupador, temMeta, metaBatida }) {
      const badges = [
        { emoji: '🪙', label: 'Primeira simulação', on: temAporte },
        { emoji: '🧠', label: 'Perfil definido', on: perfilDefinido },
        { emoji: '📒', label: 'Primeiro registro', on: temLancamento },
        { emoji: '🚀', label: 'Saldo positivo', on: poupador },

        { emoji: '🏆', label: 'Meta batida', on: metaBatida },
      ];
      const feitas = badges.filter(b => b.on).length;
      return html`<section aria-labelledby="conq-titulo" class="bg-[#1a2233] p-3 rounded-2xl border border-slate-800 shadow-xl">
        <div class="flex justify-between items-center px-2"><h2 id="conq-titulo" class="text-[11px] text-slate-400 font-semibold uppercase tracking-wider">Minhas conquistas</h2><span class="text-[11px] text-slate-400">${feitas}/${badges.length}</span></div>
        <ul class="grid grid-cols-3 sm:grid-cols-6 gap-y-3 mt-2">${badges.map(b => html`<li key=${b.label} class=${'flex flex-col items-center gap-1 ' + (b.on ? 'badge-on' : 'badge-off')}><span class="text-2xl" aria-hidden="true">${b.emoji}</span><span class="text-[10px] text-slate-300 font-medium text-center">${b.label}</span><span class="sr-only">${b.on ? 'conquistada' : 'ainda não conquistada'}</span></li>`)}</ul>
      </section>`;
    }

    function MetaItem({ meta, ind, mostrar, onDepositar, onRemover }) {
      const meses = mesesAte(meta.prazo);
      const pct = Math.min(100, meta.valorAlvo > 0 ? (meta.guardado / meta.valorAlvo) * 100 : 0);
      const batida = meta.guardado >= meta.valorAlvo;
      const comRend = aporteNecessario(meta.valorAlvo, meta.guardado, meses, anualParaMensal(ind.selic));

          <div class="h-2 bg-slate-800 rounded-full overflow-hidden" role="progressbar" aria-label=${'Progresso da meta ' + meta.nome} aria-valuenow=${Math.floor(pct)} aria-valuemin="0" aria-valuemax="100"><div class=${'h-full rounded-full progress-fill ' + (batida ? 'bg-amber-400' : 'bg-[#34d399]')} style=${{ width: pct + '%' }}></div></div>

        ${!batida && meses > 0 && comRend <= 0 ? html`<div class="bg-[#1a2233] rounded-lg p-3"><p class="text-xs text-slate-200">🎉 O que você já guardou chega lá sozinho se ficar rendendo a Selic até o prazo. É só deixar aplicado.</p></div>` : null}

              <div class="flex items-center gap-2 flex-shrink-0"><span class=${'font-bold text-sm ' + (t.tipo === 'entrada' ? 'text-emerald-300' : 'text-red-300')}>${t.tipo === 'entrada' ? '+ ' : '− '}${mostrar ? fmtBRL(t.valor) : 'R$ ••••'}</span>
                <button onClick=${() => onRemover(t)} aria-label=${'Remover lançamento ' + t.descricao} class="text-slate-500 hover:text-red-300 p-1.5 rounded-lg"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button></div>

    function AuthModal({ onClose, notificar }) {
      const [modo, setModo] = useState('entrar');
      const [nome, setNome] = useState(''), [whatsapp, setWhatsapp] = useState(''), [email, setEmail] = useState(''), [senha, setSenha] = useState('');
      const [aceite, setAceite] = useState(false);
      const [erro, setErro] = useState(''), [sucesso, setSucesso] = useState(''), [loading, setLoading] = useState(false);
      const isCad = modo === 'cadastrar';
      const limpar = () => { setErro(''); setSucesso(''); };
      async function enviar(e) {
        e.preventDefault(); limpar();
        if (!sb) return setErro('Login indisponível no momento. Seus dados continuam salvos neste aparelho.');
        if (!/^\S+@\S+\.\S+$/.test(email)) return setErro('Informe um e-mail válido.');
        if (senha.length < 6) return setErro('A senha deve ter no mínimo 6 caracteres.');
        if (isCad && !nome.trim()) return setErro('Informe seu nome.');
        if (isCad && !aceite) return setErro('Para criar a conta, aceite a Política de Privacidade.');
        setLoading(true);
        try {
          if (!isCad) {
            const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: senha });
            if (error) throw error;
            notificar('Bem-vindo de volta! 👋'); onClose();
          } else {
            const { data, error } = await sb.auth.signUp({
              email: email.trim(), password: senha,
              options: { emailRedirectTo: CONFIG.appUrl, data: { display_name: nome.trim(), whatsapp: whatsapp.replace(/\D/g, '') || null, privacidade_aceita_em: new Date().toISOString() } },
            });
            if (error) throw error;
            if (data?.session) { notificar('Conta criada! Seus dados agora ficam salvos na nuvem.'); onClose(); }
            else setSucesso('Conta criada! Confirme pelo link enviado ao seu e-mail e depois entre aqui.');
          }
        } catch (err) { setErro(traduzirErro(err.message)); }
        finally { setLoading(false); }
      }
      const campo = (id, label, props) => html`<div class="space-y-1"><label htmlFor=${id} class="text-[11px] text-slate-400 font-semibold uppercase">${label}</label><input id=${id} ...${props} class="field w-full px-4 py-3 bg-[#0d1117] rounded-xl border border-slate-700 text-slate-100 placeholder-slate-500 text-base" /></div>`;
      const tabCls = (ativo) => 'flex-1 py-2 rounded-lg text-xs font-bold ' + (ativo ? 'bg-[#1a2233] text-[#34d399] border border-[#34d399]/30' : 'text-slate-400 hover:text-slate-200');
      return html`<${Modal} titulo=${isCad ? 'Criar conta grátis' : 'Entrar'} onClose=${onClose}>
        <p class="text-xs text-slate-300">O login é opcional: ele serve para acessar suas moedinhas em qualquer aparelho. O que você já registrou aqui é levado junto.</p>
        <div class="flex bg-[#0d1117]/60 p-1 rounded-xl border border-slate-800 gap-1" role="tablist">
          <button role="tab" aria-selected=${!isCad} class=${tabCls(!isCad)} onClick=${() => { setModo('entrar'); limpar(); }}>Entrar</button>
          <button role="tab" aria-selected=${isCad} class=${tabCls(isCad)} onClick=${() => { setModo('cadastrar'); limpar(); }}>Criar conta</button>
        </div>
        <form onSubmit=${enviar} class="space-y-3" noValidate>
          ${isCad ? campo('a-nome', 'Nome', { type: 'text', value: nome, onChange: e => { setNome(e.target.value); limpar(); }, autoComplete: 'name', placeholder: 'Como podemos te chamar?' }) : null}
          ${isCad ? campo('a-whats', 'WhatsApp (opcional)', { type: 'tel', value: whatsapp, onChange: e => { setWhatsapp(e.target.value); limpar(); }, autoComplete: 'tel', placeholder: '(11) 99999-9999', inputMode: 'tel' }) : null}
          ${campo('a-email', 'E-mail', { type: 'email', value: email, onChange: e => { setEmail(e.target.value); limpar(); }, autoComplete: 'email', placeholder: 'voce@email.com', inputMode: 'email' })}
          ${campo('a-senha', 'Senha', { type: 'password', value: senha, onChange: e => { setSenha(e.target.value); limpar(); }, autoComplete: isCad ? 'new-password' : 'current-password', placeholder: 'Mínimo de 6 caracteres' })}
          ${isCad ? html`<label class="flex items-start gap-2 text-xs text-slate-300"><input type="checkbox" checked=${aceite} onChange=${e => setAceite(e.target.checked)} class="mt-0.5 w-4 h-4 accent-[#34d399]" /><span>Li e aceito a Política de Privacidade. Meus dados financeiros são meus e não serão vendidos a terceiros.</span></label>` : null}
          ${erro ? html`<p role="alert" class="text-xs text-red-300 bg-red-950/50 border border-red-800/50 rounded-xl px-3 py-2">${erro}</p>` : null}
          ${sucesso ? html`<p role="status" class="text-xs text-emerald-200 bg-emerald-950/50 border border-emerald-800/50 rounded-xl px-3 py-2">${sucesso}</p>` : null}
          <button type="submit" disabled=${loading} class="btn w-full flex items-center justify-center gap-2 bg-[#34d399] hover:bg-[#6ee7b7] disabled:opacity-60 text-slate-950 font-bold py-3.5 rounded-xl text-sm">${loading ? html`<${Spinner} size="w-4 h-4" />` : isCad ? 'Criar minha conta' : 'Entrar na minha conta'}</button>
        </form>
      <//>`;
    }

    function PrivacidadeModal({ logado, onApagar, onClose }) {
      const [confirmando, setConfirmando] = useState(false);
      return html`<${Modal} titulo="Privacidade e seus dados" onClose=${onClose} largura="max-w-md">
        <div class="text-sm text-slate-300 space-y-3 leading-relaxed">
          <p><strong class="text-slate-100">Seus dados financeiros pertencem a você.</strong> O Minhas Moedinhas não vende, aluga nem compartilha seus dados com terceiros.</p>
          <p><strong class="text-slate-100">Sem conta:</strong> tudo fica salvo apenas neste navegador (localStorage). Nada é enviado para nossos servidores.</p>
          <p><strong class="text-slate-100">Com conta:</strong> guardamos nome, e-mail, WhatsApp (se informado), sua simulação, seus lançamentos e suas metas em servidor seguro (Supabase), protegidos para que só você acesse.</p>
          <p><strong class="text-slate-100">Indicadores:</strong> Selic, CDI e IPCA vêm da API pública do Banco Central; nenhuma informação sua é enviada a ela.</p>
          <p><strong class="text-slate-100">Seus direitos (LGPD):</strong> você pode apagar seus dados a qualquer momento pelo botão abaixo. Para excluir a conta de login por completo, fale com a gente pelos canais oficiais.</p>
        </div>
        ${confirmando
          ? html`<div class="space-y-2 bg-red-950/40 border border-red-800/50 rounded-xl p-3"><p class="text-xs text-red-200">Isso apaga sua simulação e todos os lançamentos ${logado ? 'da sua conta' : 'deste aparelho'}. Não dá para desfazer.</p><div class="flex gap-2"><button onClick=${() => setConfirmando(false)} class="btn flex-1 py-2 rounded-xl border border-slate-600 text-sm text-slate-200">Cancelar</button><button onClick=${async () => { await onApagar(); onClose(); }} class="btn flex-1 py-2 rounded-xl bg-red-500 hover:bg-red-400 text-sm font-bold text-white">Apagar tudo</button></div></div>`
          : html`<button onClick=${() => setConfirmando(true)} class="btn w-full py-2.5 rounded-xl border border-red-700/60 text-red-300 hover:bg-red-950/40 text-sm font-semibold">Apagar meus dados</button>`}
      <//>`;
    }

    function OnboardingModal({ onComplete }) {
      const [step, setStep] = useState(1);
      return html`<${Modal} titulo=${step === 1 ? 'Bem-vindo ao Minhas Moedinhas' : 'Como funciona?'} onClose=${onComplete}>
        ${step === 1
          ? html`<div class="text-center space-y-3"><div class="text-4xl" aria-hidden="true">💡</div><p class="text-sm text-slate-300">Investir não é clube exclusivo de rico. Aqui você <strong class="text-[#34d399]">simula, aprende e acompanha</strong> suas moedinhas de um jeito simples e visual.</p><p class="text-xs text-slate-400">Não precisa criar conta: seus dados ficam salvos neste aparelho.</p><button onClick=${() => setStep(2)} class="btn bg-[#34d399] hover:bg-[#6ee7b7] text-slate-950 font-bold py-2.5 px-6 rounded-xl text-sm">Continuar →</button></div>`
          : html`<div class="space-y-3"><ol class="space-y-2.5 text-sm text-slate-300"><li><span class="text-[#34d399] font-bold">1.</span> Diga quanto consegue guardar por mês.</li><li><span class="text-[#34d399] font-bold">2.</span> Escolha seu perfil e veja como dividir o aporte.</li><li><span class="text-[#34d399] font-bold">3.</span> Registre o que guardou e acompanhe sua evolução.</li></ol><p class="text-[11px] text-slate-400">Ferramenta educativa: não é recomendação de investimento.</p><div class="text-center"><button onClick=${onComplete} class="btn bg-[#34d399] hover:bg-[#6ee7b7] text-slate-950 font-bold py-2.5 px-6 rounded-xl text-sm">Começar</button></div></div>`}
      <//>`;
    }

    function Rodape({ onPrivacidade }) {
      const texto = encodeURIComponent('Descobri um app gratuito que ajuda a planejar investimentos de um jeito simples: ' + CONFIG.appUrl);
      return html`<footer class="pt-4 border-t border-slate-800/60 space-y-3 text-center">
        <a href=${'https://api.whatsapp.com/send?text=' + texto} target="_blank" rel="noopener noreferrer" class="btn inline-flex items-center gap-1.5 text-xs text-slate-200 bg-[#25D366]/10 hover:bg-[#25D366]/20 border border-[#25D366]/30 rounded-full px-3 py-1.5"><span aria-hidden="true">💬</span>Indicar para um amigo no WhatsApp</a>
        <div class="text-left bg-[#1a2233]/60 border border-slate-800 rounded-xl p-3">
          <p class="text-[11px] text-slate-400 leading-relaxed"><strong class="text-slate-300">Aviso Legal:</strong> O Minhas Moedinhas é uma ferramenta exclusivamente de caráter educativo e de simulação. As informações e cálculos aqui apresentados não constituem, sob hipótese alguma, recomendação de compra, venda ou alocação de ativos financeiros. Investimentos envolvem riscos. Rendimento passado não é garantia de rendimento futuro.</p>
        </div>
        <button onClick=${onPrivacidade} class="text-[11px] text-slate-400 underline underline-offset-2 hover:text-slate-200">Privacidade e seus dados (LGPD)</button>
        <p class="text-[10px] text-slate-500">© ${new Date().getFullYear()} Minhas Moedinhas</p>
      </footer>`;
    }

    /* ════════ APP ════════ */
    function App() {
      const [user, setUser] = useState(null);
      const [authPronto, setAuthPronto] = useState(!sb);
      const [dados, setDados] = useState({ carteira: { aporte: null, perfil: 'moderado' }, transacoes: [], metas: [] });
      const [lembreteDispensado, setLembreteDispensado] = useState(() => local.get('lembrete:' + mesAtualISO(), false));
      const [carregando, setCarregando] = useState(true);
      const [salvando, setSalvando] = useState(false);
      const [mostrar, setMostrar] = useState(() => local.get('mostrarValores', true));
      const [perfilDefinido, setPerfilDefinido] = useState(() => local.get('perfilDefinido', false));
      const [onboarding, setOnboarding] = useState(() => !local.get('onboardingVisto', false) && localStorage.getItem('onboarding_visto') !== 'true');
      const [modal, setModal] = useState(null); // 'auth' | 'lancamento' | 'privacidade' | {remover: t}
      const [toast, setToast] = useState(null);
      const ind = useIndicadores();
      const notificar = useCallback((msg, tipo = 'ok') => setToast({ msg, tipo }), []);

      const repo = useMemo(() => (user && sb ? criarRepoNuvem(user.id) : criarRepoLocal()), [user?.id]);

      useEffect(() => {
        if (!sb) return;
        sb.auth.getSession().then(({ data }) => { setUser(data?.session?.user ?? null); setAuthPronto(true); }).catch(() => setAuthPronto(true));
        const { data } = sb.auth.onAuthStateChange((_evt, session) => setUser(session?.user ?? null));
        return () => data?.subscription?.unsubscribe();
      }, []);

      useEffect(() => {
        if (!authPronto) return;
        let ativo = true;
        (async () => {
          setCarregando(true);
          try {
            if (repo.modo === 'nuvem' && await migrarVisitanteParaNuvem(repo)) notificar('Levamos para sua conta o que você tinha registrado neste aparelho.');
            const d = await repo.carregar();
            if (ativo) setDados({ metas: [], ...d, carteira: { ...d.carteira, perfil: PERFIS[d.carteira.perfil] ? d.carteira.perfil : 'moderado' } });
          } catch (err) {
            console.error('[dados]', err);
            notificar('Não foi possível carregar seus dados da nuvem. ' + traduzirErro(err.message), 'erro');
          } finally { if (ativo) setCarregando(false); }
        })();
        return () => { ativo = false; };
      }, [repo, authPronto]);

      useEffect(() => { local.set('mostrarValores', mostrar); }, [mostrar]);

      async function salvarCarteira(aporte, perfil) {
        setDados(d => ({ ...d, carteira: { aporte, perfil } }));
        setSalvando(true);
        try { await repo.salvarCarteira(aporte, perfil); }
        catch (err) { notificar('Não foi possível salvar: ' + traduzirErro(err.message), 'erro'); }
        finally { setSalvando(false); }
      }
      const onSimular = (v) => salvarCarteira(v, dados.carteira.perfil);
      const onPerfil = (p) => { setPerfilDefinido(true); local.set('perfilDefinido', true); salvarCarteira(dados.carteira.aporte, p); };

      async function onSalvarLancamento(t) {
        try {
          const nova = await repo.adicionarTransacao(t);
          setDados(d => ({ ...d, transacoes: [nova, ...d.transacoes] }));
          notificar('Lançamento salvo!');
          return true;
        } catch (err) { notificar('Erro ao salvar: ' + traduzirErro(err.message), 'erro'); return false; }
      }
      async function onRemover(t) {
        const antes = dados.transacoes;
        setDados(d => ({ ...d, transacoes: d.transacoes.filter(x => x.id !== t.id) }));
        try { await repo.removerTransacao(t.id); notificar('Lançamento removido.'); }
        catch (err) { setDados(d => ({ ...d, transacoes: antes })); notificar('Erro ao remover: ' + traduzirErro(err.message), 'erro'); }
      }
      async function onApagarTudo() {
        try {
          await repo.apagarTudo();
          local.remove('perfilDefinido'); setPerfilDefinido(false);
          setDados({ carteira: { aporte: null, perfil: 'moderado' }, transacoes: [], metas: [] });
          notificar('Seus dados foram apagados.');
        } catch (err) { notificar('Erro ao apagar: ' + traduzirErro(err.message), 'erro'); }
      }
      async function onSalvarMeta(m) {
        try {
          const meta = await repo.salvarMeta(m);
          setDados(d => ({ ...d, metas: [...d.metas.filter(x => x.id !== meta.id), meta] }));
          notificar('Meta criada! 🎯');
          return true;
        } catch (err) { notificar('Erro ao salvar a meta: ' + traduzirErro(err.message), 'erro'); return false; }
      }
      async function onDepositarMeta(meta, valor, registrar) {
        const guardado = Math.round((meta.guardado + valor) * 100) / 100;
        const batidaAgora = guardado >= meta.valorAlvo && meta.guardado < meta.valorAlvo;
        try {
          const atualizada = await repo.salvarMeta({ ...meta, guardado, concluidaEm: batidaAgora ? new Date().toISOString() : meta.concluidaEm || null });
          setDados(d => ({ ...d, metas: d.metas.map(x => (x.id === meta.id ? atualizada : x)) }));
          if (registrar) {
            const t = await repo.adicionarTransacao({ descricao: ('Meta: ' + meta.nome).slice(0, 80), valor, tipo: 'entrada' });
            setDados(d => ({ ...d, transacoes: [t, ...d.transacoes] }));
          }
          notificar(batidaAgora ? `🏆 Você bateu a meta “${meta.nome}”! Parabéns!` : 'Depósito registrado! Continue assim 💪');
          return true;
        } catch (err) { notificar('Erro ao registrar: ' + traduzirErro(err.message), 'erro'); return false; }
      }
      async function onRemoverMeta(meta) {
        const antes = dados.metas;
        setDados(d => ({ ...d, metas: d.metas.filter(x => x.id !== meta.id) }));
        try { await repo.removerMeta(meta.id); notificar('Meta removida.'); }
        catch (err) { setDados(d => ({ ...d, metas: antes })); notificar('Erro ao remover: ' + traduzirErro(err.message), 'erro'); }
      }
      function dispensarLembrete() { local.set('lembrete:' + mesAtualISO(), true); setLembreteDispensado(true); }

      async function sair() { try { await sb?.auth.signOut(); notificar('Você saiu da conta. Este aparelho volta ao modo sem login.'); } catch {} }

      if (!authPronto || carregando) {
        return html`<div class="min-h-screen flex items-center justify-center gap-3 bg-[#0d1117]" role="status"><${Spinner} size="w-7 h-7" /><p class="text-sm text-slate-400">Carregando suas moedinhas…</p></div>`;
      }

      const { carteira, transacoes, metas } = dados;
      const saldo = transacoes.reduce((a, t) => a + (t.tipo === 'entrada' ? t.valor : -t.valor), 0);
      const metasAtivas = metas.filter(m => m.guardado < m.valorAlvo && mesesAte(m.prazo) > 0);
      const mesAtual = mesAtualISO();
      const entrouEsteMes = transacoes.some(t => t.tipo === 'entrada' && String(t.created_at).slice(0, 7) === mesAtual);
      const metaDoLembrete = !lembreteDispensado && !entrouEsteMes && metasAtivas.length ? metasAtivas[0] : null;
      const valorMesDe = (m) => aporteNecessario(m.valorAlvo, m.guardado, mesesAte(m.prazo), anualParaMensal(ind.selic));
      const nome = (user?.user_metadata?.display_name || user?.email || '').split(/[\s@]/)[0];

      return html`
        <a href="#conteudo" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 bg-[#34d399] text-slate-950 px-3 py-2 rounded-lg z-50">Pular para o conteúdo</a>
        <div class="max-w-md sm:max-w-2xl mx-auto p-4 min-h-screen flex flex-col gap-5 pb-10 fade-up">
          <header class="pt-4 space-y-3">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <div class="flex items-center gap-2"><${CoinLogo} size=${26} /><h1 class="text-2xl font-extrabold text-[#34d399] tracking-tight">Minhas Moedinhas</h1></div>
                <p class="text-xs text-slate-400 mt-1 ml-8 truncate">${user ? `Olá, ${nome} 👋 · sincronizado` : 'Modo sem login · salvo neste aparelho'}</p>
              </div>
              <div class="flex items-center gap-1.5 flex-shrink-0">
                <button onClick=${() => setMostrar(m => !m)} aria-pressed=${!mostrar} aria-label=${mostrar ? 'Ocultar valores' : 'Mostrar valores'} class="text-slate-300 hover:text-[#34d399] p-2 rounded-full hover:bg-slate-800/60"><span aria-hidden="true">${mostrar ? '👁️' : '🙈'}</span></button>
                ${user
                  ? html`<button onClick=${sair} class="btn text-[11px] text-slate-300 px-3 py-1.5 rounded-full border border-slate-700 hover:bg-slate-800">Sair</button>`
                  : sb ? html`<button onClick=${() => setModal('auth')} class="btn text-[11px] font-semibold text-[#34d399] px-3 py-1.5 rounded-full border border-[#34d399]/40 hover:bg-[#34d399]/10">Entrar / Sincronizar</button>` : null}
              </div>
            </div>
            <${Indicadores} ind=${ind} />
          </header>

          <main id="conteudo" class="flex flex-col gap-5">
            ${metaDoLembrete ? html`<${LembreteMensal} meta=${metaDoLembrete} valorMes=${valorMesDe(metaDoLembrete)} mostrar=${mostrar} onDepositar=${(m) => setModal({ depositar: m })} onDispensar=${dispensarLembrete} />` : null}
            <div class="grid gap-5 sm:grid-cols-2 sm:items-start">
              <${Simulador} aporte=${carteira.aporte} perfil=${carteira.perfil} ind=${ind} mostrar=${mostrar} salvando=${salvando} onSimular=${onSimular} onPerfil=${onPerfil} />
              <${GraficoCard} aporte=${carteira.aporte} perfil=${carteira.perfil} ind=${ind} transacoes=${transacoes} mostrar=${mostrar} />
            </div>
            <${Metas} metas=${metas} ind=${ind} mostrar=${mostrar} onNova=${(nome) => setModal({ novaMeta: nome || '' })} onDepositar=${(m) => setModal({ depositar: m })} onRemover=${(m) => setModal({ removerMeta: m })} />
            <${Gerenciador} transacoes=${transacoes} mostrar=${mostrar} onNovo=${() => setModal('lancamento')} onRemover=${(t) => setModal({ remover: t })} />
            <${Conquistas} temAporte=${!!carteira.aporte} perfilDefinido=${perfilDefinido} temLancamento=${transacoes.length > 0} poupador=${saldo > 0} temMeta=${metas.length > 0} metaBatida=${metas.some(m => m.guardado >= m.valorAlvo)} />
            <${ParaEstudar} perfil=${carteira.perfil} />
            <${BannerParceiro} />
          </main>

          <${Rodape} onPrivacidade=${() => setModal('privacidade')} />
        </div>

        ${modal === 'auth' ? html`<${AuthModal} onClose=${() => setModal(null)} notificar=${notificar} />` : null}
        ${modal === 'lancamento' ? html`<${NovoLancamento} onSalvar=${onSalvarLancamento} onClose=${() => setModal(null)} />` : null}
        ${modal === 'privacidade' ? html`<${PrivacidadeModal} logado=${!!user} onApagar=${onApagarTudo} onClose=${() => setModal(null)} />` : null}
        ${modal && modal.remover ? html`<${Modal} titulo="Remover lançamento?" onClose=${() => setModal(null)}>
            <p class="text-sm text-slate-300">“${modal.remover.descricao}” · ${fmtBRL(modal.remover.valor)}</p>
            <div class="flex gap-2"><button onClick=${() => setModal(null)} class="btn flex-1 py-2.5 rounded-xl border border-slate-600 text-sm text-slate-200">Cancelar</button><button onClick=${() => { const t = modal.remover; setModal(null); onRemover(t); }} class="btn flex-1 py-2.5 rounded-xl bg-red-500 hover:bg-red-400 text-sm font-bold text-white">Remover</button></div>
          <//>` : null}
        ${modal && modal.novaMeta !== undefined ? html`<${NovaMeta} nomeInicial=${modal.novaMeta} onSalvar=${onSalvarMeta} onClose=${() => setModal(null)} />` : null}
        ${modal && modal.depositar ? html`<${DepositoMeta} meta=${modal.depositar} sugestao=${valorMesDe(modal.depositar)} onSalvar=${onDepositarMeta} onClose=${() => setModal(null)} />` : null}
        ${modal && modal.removerMeta ? html`<${Modal} titulo="Remover meta?" onClose=${() => setModal(null)}>
            <p class="text-sm text-slate-300">“${modal.removerMeta.nome}”. Os lançamentos já registrados no gerenciador continuam lá.</p>
            <div class="flex gap-2"><button onClick=${() => setModal(null)} class="btn flex-1 py-2.5 rounded-xl border border-slate-600 text-sm text-slate-200">Cancelar</button><button onClick=${() => { const m = modal.removerMeta; setModal(null); onRemoverMeta(m); }} class="btn flex-1 py-2.5 rounded-xl bg-red-500 hover:bg-red-400 text-sm font-bold text-white">Remover</button></div>
          <//>` : null}
        ${onboarding && !modal ? html`<${OnboardingModal} onComplete=${() => { local.set('onboardingVisto', true); setOnboarding(false); }} />` : null}
        <${Toast} toast=${toast} onClose=${() => setToast(null)} />
      `;
    }

    /* Exposto para testes automatizados (sem efeito no app). */
    window.__MM__ = { parseValor, projetarAportes, evolucaoPatrimonio, anualParaMensal, mesesAte, aporteNecessario, sugestaoParaMeta, PERFIS };

    ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  })();
  </script>
</body>
</html>
